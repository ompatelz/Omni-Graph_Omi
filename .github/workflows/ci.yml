name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: omnigraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database schema
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U postgres -d omnigraph -f sql/schema.sql
          psql -h localhost -U postgres -d omnigraph -f sql/sample_data.sql
          psql -h localhost -U postgres -d omnigraph -f sql/procedures_triggers.sql

      - name: Re-embed documents & Run Pytest Suite
        env:
          OMNIGRAPH_DB_HOST: localhost
          OMNIGRAPH_DB_PORT: 5432
          OMNIGRAPH_DB_NAME: omnigraph
          OMNIGRAPH_DB_USER: postgres
          OMNIGRAPH_DB_PASSWORD: password
          OMNIGRAPH_EMBEDDING_PROVIDER: local
          OMNIGRAPH_LLM_PROVIDER: local
        run: |
          python reembed.py
          python -m pytest tests/ -v
